services:
  db:
    image: postgres:16-alpine
    container_name: tirana-pg
    environment:
      POSTGRES_USER: rent
      POSTGRES_PASSWORD: rent
      POSTGRES_DB: rentfinder
    ports:
      # 5433 on the host so we don't collide with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - tirana-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent -d rentfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tirana-pg-data:
